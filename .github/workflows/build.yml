name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'
        
    - name: Get dependencies
      run: go mod download
      
    - name: Build
      run: go build -v -o scrcpy-manager.exe
      
    - name: Run tests
      run: go test -v ./...
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: scrcpy-manager-unsigned
        path: scrcpy-manager.exe
        retention-days: 7